[package]
name = "zboxd"
version = "0.1.0"
edition = "2021"
description = "ZBox soft-router control plane: sing-box config generation and orchestration"

[lib]
name = "zboxd"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

